name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Generate sample data (deterministic, seeded)
        run: python scripts/gen_sales_data.py

      # No LLM calls and no secrets: tests cover the SQL guardrails, the profiler,
      # the analytical battery, and the figure-verification logic.
      - name: Tests
        run: pytest -q
