# Warm light theme + chrome settings for the Streamlit app.

[theme]
base = "light"
primaryColor = "#B5532E"
backgroundColor = "#F2ECE3"
secondaryBackgroundColor = "#FBF8F2"
textColor = "#221E19"

[client]
# Hide the developer toolbar (the "Deploy" button + menu) for a clean app look.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
# Cap uploads (the default is 200MB) to bound memory/cost. Matches the API's 25MB
# limit (app/main.py). Visitors get a generous trial; see src/limits.py.
maxUploadSize = 25
